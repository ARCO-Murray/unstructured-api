name: Trigger auto build for unstructured-job

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ jobify ]
    paths:
    - '**'
    - '.github/workflows/unstructured-job-AutoBuildTrigger.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo
      
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.UNSTRUCTUREDAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.UNSTRUCTUREDAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.UNSTRUCTUREDAPI_AZURE_SUBSCRIPTION_ID }}
          
      - name: 'Docker login to registry'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.UNSTRUCTUREDAPI_REGISTRY_USERNAME }}
          password: ${{ secrets.UNSTRUCTUREDAPI_REGISTRY_PASSWORD }}
          
      - name: 'Build and Push Extractous Image'
        run: |
          docker build . -f extractous_src/Dockerfile -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/extractous_job:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/extractous_job:${{ github.sha }}
          
      - name: 'Build and Push Unstructured image'
        run: |
          docker build . -f unstructured_src/Dockerfile -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/unstructured_job:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/unstructured_job:${{ github.sha }}
