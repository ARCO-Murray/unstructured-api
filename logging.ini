[loggers]
keys=root

[handlers]
keys=stream_handler

[formatters]
keys=simple,message_only

[logger_root]
level=DEBUG
handlers=stream_handler

[handler_stream_handler]
class=StreamHandler
level=DEBUG
formatter=simple
args=(sys.stdout,)

[formatter_message_only]
format=%(message)s

[formatter_simple]
format=%(asctime)s %(name)-10s [%(levelname)-5.5s] %(message)s [%(filename)s:%(funcName)s]
datefmt=%Y-%m-%d %H:%M:%S


